[package]
name = "fount-core"
version = "0.1.1"
edition = "2024"
description = "The backend library for the Fount Linux application launcher"
license = "GPL-3.0-or-later"
repository = "https://github.com/bmalia/fount-launcher"
readme = "../../README.md"

[dependencies]
nucleo = "0.5.0"
freedesktop-desktop-entry = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
walkdir = "2.5.0"
thiserror = "2.0.21"
config = { version = "0.15.26", features = ["json"] }
bincode = "1.3.3"

[dev-dependencies]
tempfile = "3.17"
