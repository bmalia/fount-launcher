[package]
name = "fount-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
fount-core = { path = "../fount-core" }
tokio = { version = "1.0", features = ["full"] }
zbus = "5.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bincode = "1.3.3"
bytes = "1.12.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.17"
